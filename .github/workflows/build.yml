name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build single-file exe
        shell: cmd
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --icon icon.ico
          --name "Tianditu-ArcMap-Loader"
          tianditu_gui.py

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: tianditu-arcmap-windows
          path: dist/Tianditu-ArcMap-Loader.exe
          if-no-files-found: error

      - name: Generate checksums
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist/Tianditu-ArcMap-Loader.exe" -Algorithm SHA256).Hash
          "$hash  Tianditu-ArcMap-Loader.exe" | Out-File -Encoding ascii "dist/SHA256SUMS.txt"
          Get-Content "dist/SHA256SUMS.txt"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/Tianditu-ArcMap-Loader.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            > ⚠️ 本程序未使用商业代码签名证书，Windows **SmartScreen** 可能提示
            > “未知发布者 / 无法验证此文件是否安全”。这是**未签名 exe 的通用提示**，
            > 并非检测到病毒。可先核对下方 `SHA256SUMS.txt`，再点「更多信息 → 仍要运行」。
            > 详见 README 的「Windows/SmartScreen 提示怎么办」与「代码签名」两节。
