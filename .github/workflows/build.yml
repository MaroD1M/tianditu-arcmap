name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Generate version resource
        run: python tools/make_version_info.py

      - name: Build single-file exe
        shell: cmd
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed --noupx
          --icon icon.ico
          --version-file version_info.txt
          --name "Tianditu-ArcMap-Loader"
          tianditu_gui.py

      - name: Package portable zip
        shell: pwsh
        run: |
          $ver = (Select-String -Path constants.py -Pattern 'APP_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          $lines = @(
            "天地图 ArcMap 加载工具 v$ver",
            "",
            "1. 双击 Tianditu-ArcMap-Loader.exe 运行（无需安装 Python、运行期零第三方依赖）。",
            "2. 首次运行 Windows 可能提示 SmartScreen「未知发布者」，属未签名程序的通用提示，",
            "   可点「更多信息 -> 仍要运行」，或右键文件 属性 勾选「解除锁定」。",
            "3. 在主界面添加天地图密钥 -> 启动服务 -> 复制地址，",
            "   再到 ArcMap「目录 -> GIS 服务器 -> 添加 WMTS 服务器」粘贴地址。",
            "4. config.json 与 cache 目录会在此文件同目录自动生成。",
            "",
            "项目主页：https://github.com/MaroD1M/tianditu-arcmap"
          )
          $lines | Out-File -Encoding utf8 "dist/使用提示.txt"
          Compress-Archive -Path "dist/Tianditu-ArcMap-Loader.exe", "dist/使用提示.txt" `
            -DestinationPath "dist/Tianditu-ArcMap-Loader-portable.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: tianditu-arcmap-windows
          path: |
            dist/Tianditu-ArcMap-Loader.exe
            dist/Tianditu-ArcMap-Loader-portable.zip
          if-no-files-found: error

      - name: Generate checksums
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $files = @(
            "dist/Tianditu-ArcMap-Loader.exe",
            "dist/Tianditu-ArcMap-Loader-portable.zip"
          )
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash $f -Algorithm SHA256).Hash
            "$h  $(Split-Path $f -Leaf)"
          }
          $lines | Out-File -Encoding ascii "dist/SHA256SUMS.txt"
          Get-Content "dist/SHA256SUMS.txt"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/Tianditu-ArcMap-Loader.exe
            dist/Tianditu-ArcMap-Loader-portable.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            > ⚠️ 本程序未使用商业代码签名证书，Windows **SmartScreen** 可能提示
            > “未知发布者 / 无法验证此文件是否安全”。这是**未签名 exe 的通用提示**，
            > 并非检测到病毒。可先核对 `SHA256SUMS.txt`，再点「更多信息 → 仍要运行」，
            > 或右键文件 → 属性 → 勾选「解除锁定」。
            > 详见 README 的「Windows/SmartScreen 提示怎么办」与「代码签名」两节。
